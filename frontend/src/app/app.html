@if (currentUser) {
  <div class="app-layout" [class.sidebar-collapsed]="!sidebarOpen">
    
    <!-- Mobile / Overlay Backdrop for sliding sidebar -->
    <div
      class="sidebar-backdrop"
      [class.active]="sidebarOpen"
      (click)="closeSidebar()"
      aria-hidden="true"
    ></div>

    <!-- Left Sidebar -->
    <aside class="sidebar" [class.open]="sidebarOpen">
      
      <div class="sidebar-header">
        <a routerLink="/home" class="brand-group-link" title="Go to Home">
          <div class="brand-group">
            <div class="brand-logo">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
            </div>
            <span class="brand-name">FitTrack</span>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav">
        
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </span>
          <span class="nav-label">Dashboard</span>
        </a>

        <a routerLink="/activities" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
          </span>
          <span class="nav-label">Activities</span>
        </a>

        <a routerLink="/add-activity" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </span>
          <span class="nav-label">Add Activity</span>
        </a>

        <a routerLink="/leaderboard" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
          </span>
          <span class="nav-label">Leaderboard</span>
        </a>

      </nav>

      <!-- Logout at bottom -->
      <div class="sidebar-bottom">
        <a class="nav-item logout-item" (click)="logout()">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </span>
          <span class="nav-label">Logout</span>
        </a>
      </div>

    </aside>

    <!-- Main Content Area -->
    <div class="main-content">

      <!-- Top Header with Toggle Button & Breadcrumbs / Actions -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button
            type="button"
            class="sidebar-toggle-btn"
            (click)="toggleSidebar()"
            [title]="sidebarOpen ? 'Close sidebar' : 'Open sidebar'"
            aria-label="Toggle navigation"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          
          <a routerLink="/home" class="topbar-brand-link" title="Go to Home">
            <div class="topbar-brand">
              <div class="brand-badge-mini">⚡</div>
              <span class="brand-title-mini">FitTrack</span>
            </div>
          </a>
        </div>

        <div class="topbar-right">
          <button 
            type="button" 
            class="theme-toggle-btn" 
            (click)="themeService.toggleTheme()" 
            [title]="themeService.isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
            aria-label="Toggle theme mode"
          >
            @if (themeService.isDarkMode) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m6.34 17.66-1.41 1.41"></path>
                <path d="m19.07 4.93-1.41 1.41"></path>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
              </svg>
            }
          </button>
          <a routerLink="/add-activity" class="topbar-btn-add">+ Log Activity</a>
        </div>
      </header>

      <main class="page-container">
        <router-outlet></router-outlet>
      </main>

    </div>

  </div>
} @else {
  <!-- Public Layout with Navbar wrapping Login, Register, Home, Leaderboard -->
  <div class="public-layout">
    
    <header class="public-navbar">
      <div class="public-nav-inner">
        
        <a routerLink="/home" class="public-nav-brand" (click)="closePublicNav()">
          <div class="brand-badge">⚡</div>
          <span class="brand-title">FitTrack</span>
        </a>

        <nav class="public-nav-links">
          <a routerLink="/home" fragment="hero" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
          <a routerLink="/home" fragment="activities">Sports</a>
          <a routerLink="/home" fragment="quotes">Inspiration</a>
          <a routerLink="/home" fragment="how-it-works">Point System</a>
          <a routerLink="/leaderboard" routerLinkActive="active">Leaderboard</a>
        </nav>

        <div class="public-nav-actions">
          <button 
            type="button" 
            class="theme-toggle-btn public-theme-toggle" 
            (click)="themeService.toggleTheme()" 
            [title]="themeService.isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
            aria-label="Toggle theme mode"
          >
            @if (themeService.isDarkMode) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m6.34 17.66-1.41 1.41"></path>
                <path d="m19.07 4.93-1.41 1.41"></path>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
              </svg>
            }
          </button>
          <a routerLink="/login" routerLinkActive="active" class="btn-ghost">Log In</a>
          <a routerLink="/register" routerLinkActive="active" class="btn-primary">Sign Up Free</a>
        </div>

        <button class="public-menu-toggle" (click)="togglePublicNav()" aria-label="Toggle navigation">
          ☰
        </button>

      </div>

      <!-- Public Mobile Dropdown Menu -->
      <div class="public-mobile-menu" [class.open]="publicNavOpen">
        <a routerLink="/home" fragment="hero" (click)="closePublicNav()">Home</a>
        <a routerLink="/home" fragment="activities" (click)="closePublicNav()">Sports</a>
        <a routerLink="/home" fragment="quotes" (click)="closePublicNav()">Inspiration</a>
        <a routerLink="/home" fragment="how-it-works" (click)="closePublicNav()">Point System</a>
        <a routerLink="/leaderboard" (click)="closePublicNav()">Leaderboard</a>
        <div class="mobile-menu-divider"></div>
        <button 
          type="button" 
          class="theme-toggle-btn mobile-theme-toggle" 
          (click)="themeService.toggleTheme(); closePublicNav()"
        >
          <span>{{ themeService.isDarkMode ? '☀️ Switch to Light Mode' : '🌙 Switch to Dark Mode' }}</span>
        </button>
        <a routerLink="/login" routerLinkActive="active" class="mobile-btn-ghost" (click)="closePublicNav()">Log In</a>
        <a routerLink="/register" routerLinkActive="active" class="mobile-btn-primary" (click)="closePublicNav()">Sign Up Free</a>
      </div>
    </header>

    <main class="public-main-content">
      <router-outlet></router-outlet>
    </main>

  </div>
}
